<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Splitpot ledger</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--fg:#1f2a3d;--muted:#7c8fb0;--border:#e0e6eb;
      --primary:#00a1ff;--up:#36c96c;--down:#ff6692;--chip:#eff4fa;--paybg:#e9fbef;--paybd:#b6ecc8}
@media (prefers-color-scheme:dark){:root{--bg:#1a2537;--card:#2a3851;--fg:#fff;--muted:#9baac4;
      --border:#333f55;--chip:#243149;--paybg:#16352a;--paybd:#25573f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);padding:24px 16px 48px;
     font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
.wrap{max-width:520px;margin:0 auto}
.center{text-align:center}
h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:.3em 0 .1em}
h2{font-size:20px;font-weight:800;margin:28px 0 12px}
.sub{color:var(--muted);margin:0 0 14px}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--border);
      border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.tile{background:var(--chip);border-radius:16px;padding:14px}
.tile .k{color:var(--muted);font-size:13px}
.tile .v{font-size:22px;font-weight:800;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;
      padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.name{font-weight:700}
.small{color:var(--muted);font-size:14px}
.amt{font-weight:800;font-size:20px;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 20px;
       background:var(--primary);color:#fff;cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
.paidchip{background:var(--chip);border:1px solid var(--border);border-radius:999px;
          padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.pay{background:var(--paybg);border:1px solid var(--paybd);border-radius:12px;
     padding:10px 12px;margin-top:10px;font-size:14px}
.foot{color:var(--muted);font-size:14px;text-align:center;margin-top:32px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="center small">Loading ledger…</p></div>

<script>
// Publishable key: safe to ship. Every table is behind RLS and the anon role holds no table
// grants at all — only EXECUTE on get_ledger and mark_settlement_paid.
const SUPABASE_URL = "https://sdslqdlmputkhadbrtnm.supabase.co";
const SUPABASE_KEY = "sb_publishable_w7JkJoarKKptxjlU8Zp34A_bNEv02M-";

const slug = new URLSearchParams(location.search).get("g") || "";
const app = document.getElementById("app");

const ZERO_DECIMAL = new Set(["JPY","KRW","CLP","PYG","VND","ISK"]);
const SYMBOLS = {GBP:"£",USD:"$",EUR:"€",INR:"₹",JPY:"¥",PYG:"₲",BRL:"R$",CAD:"$",AUD:"$",
                 NZD:"$",MXN:"$",ARS:"$",CLP:"$",COP:"$",PEN:"S/",CHF:"Fr",ZAR:"R"};

function money(cents, cur, signed){
  const digits = ZERO_DECIMAL.has(cur) ? 0 : 2;
  const abs = Math.abs(cents) / Math.pow(10, digits);
  const body = Number.isInteger(abs)
    ? abs.toLocaleString("en-GB")
    : abs.toLocaleString("en-GB",{minimumFractionDigits:digits,maximumFractionDigits:digits});
  const sign = cents < 0 ? "-" : (signed && cents > 0 ? "+" : "");
  return sign + (SYMBOLS[cur] || cur + " ") + body;
}

function ago(iso){
  const m = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000));
  if (m < 1) return "Just now";
  if (m < 60) return m + "m ago";
  if (m < 1440) return Math.floor(m/60) + "h ago";
  return Math.floor(m/1440) + "d ago";
}

async function rpc(fn, body){
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {"content-type":"application/json", apikey: SUPABASE_KEY,
              authorization: "Bearer " + SUPABASE_KEY},
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("rpc " + fn + " " + res.status);
  return res.json();
}

/** Build every node with textContent — player names are user input and never become markup. */
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function card(){ return el("div","card"); }

function render(d){
  const g = d.game, cur = g.currency;
  app.replaceChildren();

  const head = el("div","center");
  head.append(el("h1", null, g.name));
  const date = new Date(g.played_on + "T00:00:00Z").toLocaleDateString("en-GB",
    {weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
  head.append(el("p","sub", date + (g.location ? " · " + g.location : "")));
  head.append(el("span","chip", g.status === "settled" ? "Finished · Settling up" : "Live · In progress"));
  app.append(head);

  const grid = el("div","grid");
  const inPlay = d.totals.buyin_cents - d.totals.cashout_cents;
  [["Buy-ins", money(d.totals.buyin_cents,cur)],
   ["Cash-outs", money(d.totals.cashout_cents,cur)],
   ["Players", String(d.totals.players)],
   ["In play", money(inPlay,cur)]].forEach(([k,v]) => {
    const t = el("div","tile"); t.append(el("div","k",k), el("div","v",v)); grid.append(t);
  });
  app.append(grid);

  if (d.settlement.length){
    app.append(el("h2",null,"Settlement"));
    d.settlement.forEach(s => {
      const c = card();
      const row = el("div","row"), grow = el("div","grow");
      grow.append(el("span","name",s.from_name), el("span","small"," pays "), el("span","name",s.to_name));
      row.append(grow, el("div","amt", money(s.amount_cents,cur)));
      c.append(row);

      const actions = el("div","row"); actions.style.marginTop = "12px";
      if (s.status === "paid"){
        actions.append(el("span","paidchip","Paid"));
        c.append(actions);
      } else {
        actions.append(el("span","paidchip","Pending"));
        const btn = el("button",null,"Mark as paid");
        btn.onclick = async () => {
          btn.disabled = true; btn.textContent = "Saving…";
          try {
            const ok = await rpc("mark_settlement_paid",
              {p_slug: slug, p_settlement_id: s.id, p_paid: true});
            if (!ok) throw new Error("rejected");
            load();
          } catch(e){
            btn.disabled = false; btn.textContent = "Mark as paid";
            alert("Couldn't save that. Check your connection and try again.");
          }
        };
        actions.append(btn);
        c.append(actions, el("div","pay", s.from_name + ": tap once you've sent the money."));
      }
      app.append(c);
    });
  }

  app.append(el("h2",null,"Results"));
  if (!d.results.length) app.append(el("div","card small","Nobody has bought in yet."));
  d.results.forEach(r => {
    const c = card(), row = el("div","row"), grow = el("div","grow");
    grow.append(el("div","name", r.name));
    grow.append(el("div","small",
      "In " + money(r.in_cents,cur) + " · Out " + money(r.out_cents,cur)));
    // Only ever present for players who are owed money; the server withholds it otherwise.
    if (r.payment_details) grow.append(el("div","small", r.payment_type + ": " + r.payment_details));
    const cls = r.net_cents > 0 ? "amt up" : r.net_cents < 0 ? "amt down" : "amt flat";
    row.append(grow, el("div", cls, money(r.net_cents, cur, true)));
    c.append(row); app.append(c);
  });

  app.append(el("h2",null,"Timeline"));
  if (!d.timeline.length) app.append(el("div","card small","Nothing has happened yet."));
  d.timeline.forEach(t => {
    const c = card();
    c.append(el("div","name",
      t.name + (t.kind === "buyin" ? " bought in for " : " cashed out ") + money(t.amount_cents,cur)));
    c.append(el("div","small", ago(t.at)));
    app.append(c);
  });

  app.append(el("p","foot","Settle your own poker games with Splitpot"));
  document.title = g.name + " — Splitpot ledger";
}

async function load(){
  if (!/^[A-Za-z0-9_-]{8,32}$/.test(slug)){
    app.replaceChildren(el("p","center small","That ledger link doesn't look right."));
    return;
  }
  try {
    const data = await rpc("get_ledger", {p_slug: slug});
    if (!data) {
      app.replaceChildren(el("p","center small","This ledger no longer exists."));
      return;
    }
    render(data);
  } catch(e){
    app.replaceChildren(el("p","center small","Couldn't load this ledger. Try again in a moment."));
  }
}

load();
// A live game moves; refresh while the tab is open so players see buy-ins as they happen.
setInterval(() => { if (!document.hidden) load(); }, 20000);
</script>
</body>
</html>
