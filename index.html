<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Splitpot ledger</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--fg:#1f2a3d;--muted:#7c8fb0;--border:#e0e6eb;
      --primary:#00a1ff;--up:#36c96c;--down:#ff6692;--chip:#eff4fa;--paybg:#e9fbef;--paybd:#b6ecc8}
@media (prefers-color-scheme:dark){:root{--bg:#1a2537;--card:#2a3851;--fg:#fff;--muted:#9baac4;
      --border:#333f55;--chip:#243149;--paybg:#16352a;--paybd:#25573f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);padding:24px 16px 48px;
     font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
.wrap{max-width:520px;margin:0 auto}
.center{text-align:center}
h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:.3em 0 .1em}
h2{font-size:20px;font-weight:800;margin:28px 0 12px}
.sub{color:var(--muted);margin:0 0 14px}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--border);
      border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.tile{background:var(--chip);border-radius:16px;padding:14px}
.tile .k{color:var(--muted);font-size:13px}
.tile .v{font-size:22px;font-weight:800;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;
      padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.name{font-weight:700}
.small{color:var(--muted);font-size:14px}
.amt{font-weight:800;font-size:20px;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 20px;
       background:var(--primary);color:#fff;cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
.upi{display:inline-block;text-decoration:none;font-weight:700;border-radius:999px;padding:11px 20px;
     background:var(--up);color:#fff}
.paidchip{background:var(--chip);border:1px solid var(--border);border-radius:999px;
          padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.pay{background:var(--paybg);border:1px solid var(--paybd);border-radius:12px;
     padding:10px 12px;margin-top:10px;font-size:14px}
.foot{color:var(--muted);font-size:14px;text-align:center;margin-top:32px}
.codein{display:block;width:100%;margin:16px 0 12px;padding:12px;border-radius:14px;
        border:1px solid var(--border);background:var(--bg);color:var(--fg);text-align:center;
        font:800 28px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase}
.wide{width:100%;min-height:48px}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ghost{background:var(--chip);color:var(--fg);border:1px solid var(--border)}
.link{background:none;color:var(--primary);padding:11px 4px}
.ask{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ask input{flex:1;min-width:0;width:120px;font:inherit;font-size:18px;padding:10px 16px;border-radius:999px;
           border:1px solid var(--border);background:var(--bg);color:var(--fg)}
h3{font-size:16px;font-weight:800;margin:18px 0 0}
.status{margin-top:10px;font-size:14px;font-weight:600}
.status.wait{color:var(--muted)}.status.yes{color:var(--up)}.status.no{color:var(--down)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="center small">Loading ledger…</p></div>

<script>
// Publishable key: safe to ship. Every table is behind RLS and the anon role holds no table
// grants at all — only EXECUTE on get_ledger, mark_settlement_paid, ledger_for_code and
// request_from_ledger (an ask the host must approve: nothing here writes money).
const SUPABASE_URL = "https://sdslqdlmputkhadbrtnm.supabase.co";
const SUPABASE_KEY = "sb_publishable_w7JkJoarKKptxjlU8Zp34A_bNEv02M-";

const params = new URLSearchParams(location.search);
let slug = params.get("g") || "";
const app = document.getElementById("app");

const ZERO_DECIMAL = new Set(["JPY","KRW","CLP","PYG","VND","ISK"]);
const SYMBOLS = {GBP:"£",USD:"$",EUR:"€",INR:"₹",JPY:"¥",PYG:"₲",BRL:"R$",CAD:"$",AUD:"$",
                 NZD:"$",MXN:"$",ARS:"$",CLP:"$",COP:"$",PEN:"S/",CHF:"Fr",ZAR:"R"};

function money(cents, cur, signed){
  const digits = ZERO_DECIMAL.has(cur) ? 0 : 2;
  const abs = Math.abs(cents) / Math.pow(10, digits);
  const body = Number.isInteger(abs)
    ? abs.toLocaleString("en-GB")
    : abs.toLocaleString("en-GB",{minimumFractionDigits:digits,maximumFractionDigits:digits});
  const sign = cents < 0 ? "-" : (signed && cents > 0 ? "+" : "");
  return sign + (SYMBOLS[cur] || cur + " ") + body;
}

function ago(iso){
  const m = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000));
  if (m < 1) return "Just now";
  if (m < 60) return m + "m ago";
  if (m < 1440) return Math.floor(m/60) + "h ago";
  return Math.floor(m/1440) + "d ago";
}

async function rpc(fn, body){
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {"content-type":"application/json", apikey: SUPABASE_KEY,
              authorization: "Bearer " + SUPABASE_KEY},
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("rpc " + fn + " " + res.status);
  return res.json();
}

/** Build every node with textContent — player names are user input and never become markup. */
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function card(){ return el("div","card"); }

// Same rules as lib/money.js upiLink: rupees only, a vetted id sent raw, amount to two places.
const isUpiId = (s) => /^[A-Za-z0-9._-]{2,256}@[A-Za-z][A-Za-z0-9.-]{1,63}$/.test((s || "").trim());
function upiLink(payee, cents, cur, note){
  if (!payee || cur !== "INR" || payee.payment_type !== "upi" || !isUpiId(payee.payment_details) || !(cents > 0)) return null;
  const am = Math.floor(cents / 100) + "." + String(cents % 100).padStart(2, "0");
  return "upi://pay?pa=" + payee.payment_details.trim() + "&pn=" + encodeURIComponent(payee.name)
    + "&am=" + am + "&cu=INR&tn=" + encodeURIComponent(note.slice(0, 50));
}

// Which seat is "me" on this phone, per game. Storage can be blocked: then it just asks again.
const meKey = () => "splitpot_me_" + slug;
function meId(){ try { return localStorage.getItem(meKey()); } catch(e){ return null; } }
function setMe(id){ try { id ? localStorage.setItem(meKey(), id) : localStorage.removeItem(meKey()); } catch(e){} }

// "1,200" or "1200.50" -> minor units, or null. Same bounds as the server.
function parseAmount(text, cur){
  const t = String(text || "").replace(/[,\s]/g, "");
  const digits = ZERO_DECIMAL.has(cur) ? 0 : 2;
  const ok = digits ? /^\d+(\.\d{1,2})?$/ : /^\d+$/;
  if (!ok.test(t)) return null;
  const cents = Math.round(parseFloat(t) * Math.pow(10, digits));
  return cents > 0 && cents <= 100000000 ? cents : null;
}

const REFUSED = {not_live:"The game has finished.", cashed_out:"You've already cashed out.",
  no_seat:"You're not at this table any more.", bad_amount:"That amount doesn't look right."};

/**
 * Live games only: tap your name, then ask the host for a rebuy or send your stack count.
 * Nothing is logged until the host taps Approve on their phone.
 */
function askPanel(d){
  const g = d.game, cur = g.currency;
  const seats = [...d.results].sort((a, b) => a.seat_order - b.seat_order);
  const me = seats.find(r => r.game_player_id === meId());
  const c = card();

  if (!me){
    c.append(el("div","name","At the table?"),
      el("div","small","Tap your name to ask the host for a rebuy, or to send your stack count."));
    const names = el("div","names");
    seats.forEach(r => {
      const b = el("button","ghost", r.name);
      b.onclick = () => { setMe(r.game_player_id); render(d); };
      names.append(b);
    });
    c.append(names);
    return c;
  }

  const head = el("div","row"), who = el("div","grow");
  who.append(el("div","small","You're"), el("div","name", me.name));
  const notMe = el("button","link","Not you?");
  notMe.onclick = () => { setMe(null); render(d); };
  head.append(who, notMe);
  c.append(head);

  if (me.cashed_out){
    c.append(el("div","small","You've cashed out. Tell the host if you're back in."));
    return c;
  }

  // The latest ask of this kind, worded for the player. Answers older than 30 minutes go quiet.
  const status = (kind, words) => {
    const q = (d.requests || []).find(x => x.game_player_id === me.game_player_id && x.kind === kind);
    if (!q) return null;
    const amt = money(q.amount_cents, cur);
    if (q.status === "pending") return el("div","status wait", words.wait(amt));
    if (Date.now() - new Date(q.decided_at) > 30 * 60000) return null;
    return q.status === "approved" ? el("div","status yes", words.yes(amt)) : el("div","status no", words.no(amt));
  };

  const send = async (kind, cents, btn, label, note) => {
    if (!cents){ note.className = "status no"; note.textContent = REFUSED.bad_amount; return; }
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const res = await rpc("request_from_ledger",
        {p_slug: slug, p_game_player_id: me.game_player_id, p_kind: kind, p_amount_cents: cents});
      if (res !== "ok") throw new Error(REFUSED[res] || "The host's table said no.");
      load();
    } catch(e){
      btn.disabled = false; btn.textContent = label;
      note.className = "status no";
      note.textContent = e.message && !e.message.startsWith("rpc ") ? e.message : "Couldn't send that. Check your connection and try again.";
    }
  };

  // Rebuy: the amount they last bought in for, their first if different, or any amount.
  c.append(el("h3", null, me.last_buyin_cents ? "Rebuy" : "Buy in"));
  const quick = el("div","ask"), rebuyNote = el("div");
  [me.last_buyin_cents, me.first_buyin_cents].filter((v, i, a) => v && a.indexOf(v) === i).forEach((cents, i) => {
    const label = (i === 0 ? "Again " : "") + money(cents, cur);
    const b = el("button", null, label);
    b.onclick = () => send("buyin", cents, b, label, rebuyNote);
    quick.append(b);
  });
  const other = el("input"), go = el("button","ghost","Ask");
  Object.assign(other, {inputMode:"decimal", placeholder: me.last_buyin_cents ? "Other amount" : "Amount", autocomplete:"off"});
  other.setAttribute("aria-label","Rebuy amount");
  go.onclick = () => send("buyin", parseAmount(other.value, cur), go, "Ask", rebuyNote);
  const typed = el("div","ask"); typed.append(other, go);
  c.append(quick, typed, rebuyNote);
  const rs = status("buyin", {wait: a => "Waiting for the host to approve " + a,
    yes: a => "Approved ✓ " + a + " is in", no: a => "The host didn't take the " + a + " rebuy"});
  if (rs) c.append(rs);

  // The end of the night: everyone counts their own chips, the host checks they add up.
  c.append(el("h3", null, "Count my stack"));
  const count = el("input"), sendCount = el("button", null, "Send"), countNote = el("div");
  Object.assign(count, {inputMode:"decimal", placeholder:"Chips worth", autocomplete:"off"});
  count.setAttribute("aria-label","My chips are worth");
  sendCount.onclick = () => send("cashout", parseAmount(count.value, cur), sendCount, "Send", countNote);
  const row = el("div","ask"); row.append(count, sendCount);
  c.append(row, countNote);
  const cs = status("cashout", {wait: a => "Sent " + a + ". Waiting for the host",
    yes: a => "Cashed out ✓ " + a, no: a => "The host didn't take the " + a + " count. Count again?"});
  if (cs) c.append(cs);
  return c;
}

function render(d){
  const g = d.game, cur = g.currency;
  app.replaceChildren();

  const head = el("div","center");
  head.append(el("h1", null, g.name));
  const date = new Date(g.played_on + "T00:00:00Z").toLocaleDateString("en-GB",
    {weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
  head.append(el("p","sub", date + (g.location ? " · " + g.location : "")));
  head.append(el("span","chip", g.status === "settled" ? "Finished · Settling up" : "Live · In progress"));
  app.append(head);

  if (g.status === "live" && d.results.length && d.results[0].game_player_id) app.append(askPanel(d));

  const grid = el("div","grid");
  const inPlay = d.totals.buyin_cents - d.totals.cashout_cents;
  [["Buy-ins", money(d.totals.buyin_cents,cur)],
   ["Cash-outs", money(d.totals.cashout_cents,cur)],
   ["Players", String(d.totals.players)],
   ["In play", money(inPlay,cur)]].forEach(([k,v]) => {
    const t = el("div","tile"); t.append(el("div","k",k), el("div","v",v)); grid.append(t);
  });
  app.append(grid);

  if (d.settlement.length){
    app.append(el("h2",null,"Settlement"));
    d.settlement.forEach(s => {
      const c = card();
      const row = el("div","row"), grow = el("div","grow");
      grow.append(el("span","name",s.from_name), el("span","small"," pays "), el("span","name",s.to_name));
      row.append(grow, el("div","amt", money(s.amount_cents,cur)));
      c.append(row);

      const actions = el("div","row"); actions.style.marginTop = "12px"; actions.style.flexWrap = "wrap";
      if (s.status === "paid"){
        actions.append(el("span","paidchip","Paid"));
        c.append(actions);
      } else {
        actions.append(el("span","paidchip","Pending"));
        const btn = el("button",null,"Mark as paid");
        btn.onclick = async () => {
          btn.disabled = true; btn.textContent = "Saving…";
          try {
            const ok = await rpc("mark_settlement_paid",
              {p_slug: slug, p_settlement_id: s.id, p_paid: true});
            if (!ok) throw new Error("rejected");
            load();
          } catch(e){
            btn.disabled = false; btn.textContent = "Mark as paid";
            alert("Couldn't save that. Check your connection and try again.");
          }
        };
        const payee = d.results.find(r => r.player_id === s.to_player_id);
        const href = upiLink(payee, s.amount_cents, cur, "Splitpot: " + g.name);
        if (href){
          const pay = el("a","upi","Pay " + money(s.amount_cents,cur));
          pay.href = href;
          actions.append(pay);
        }
        actions.append(btn);
        c.append(actions, el("div","pay", href
          ? s.from_name + ": Pay opens your UPI app with " + s.to_name + " and the amount filled in. Mark as paid once it's sent."
          : s.from_name + ": tap once you've sent the money."));
      }
      app.append(c);
    });
  }

  app.append(el("h2",null,"Results"));
  if (!d.results.length) app.append(el("div","card small","Nobody has bought in yet."));
  d.results.forEach(r => {
    const c = card(), row = el("div","row"), grow = el("div","grow");
    grow.append(el("div","name", r.name));
    grow.append(el("div","small",
      "In " + money(r.in_cents,cur) + " · Out " + money(r.out_cents,cur)));
    // Only ever present for players who are owed money; the server withholds it otherwise.
    if (r.payment_details) grow.append(el("div","small", (r.payment_type === "upi" ? "UPI" : r.payment_type) + ": " + r.payment_details));
    const cls = r.net_cents > 0 ? "amt up" : r.net_cents < 0 ? "amt down" : "amt flat";
    row.append(grow, el("div", cls, money(r.net_cents, cur, true)));
    c.append(row); app.append(c);
  });

  app.append(el("h2",null,"Timeline"));
  if (!d.timeline.length) app.append(el("div","card small","Nothing has happened yet."));
  d.timeline.forEach(t => {
    const c = card();
    c.append(el("div","name",
      t.name + (t.kind === "buyin" ? " bought in for " : " cashed out ") + money(t.amount_cents,cur)));
    c.append(el("div","small", ago(t.at)));
    app.append(c);
  });

  app.append(el("p","foot","Settle your own poker games with Splitpot"));
  document.title = g.name + " — Splitpot ledger";
}

// No link, just the six-character code the host's screen shows: ask for it, or take ?c=.
function codeEntry(message){
  const c = card(); c.classList.add("center");
  const form = el("form");
  const input = el("input","codein");
  Object.assign(input, {name:"code", maxLength:9, autocomplete:"off", spellcheck:false, required:true,
    placeholder:"K7QMXR"});
  input.setAttribute("autocapitalize","characters");
  input.setAttribute("aria-label","Game code");
  const go = el("button","wide","Open the game");
  form.append(input, go);
  form.onsubmit = (e) => { e.preventDefault(); go.disabled = true; go.textContent = "Opening…"; join(input.value); };
  c.append(el("h1",null,"Join a game"), el("p","sub","Type the code on the host's screen."), form);
  if (message) c.append(el("p","small",message));
  app.replaceChildren(c);
  input.focus();
}

async function join(code){
  try {
    const found = await rpc("ledger_for_code", {p_code: code});
    if (!found) return codeEntry("No live game has that code. Check it with the host.");
    slug = found;
    history.replaceState(null, "", "?g=" + encodeURIComponent(found));
    load();
  } catch(e){
    codeEntry("Couldn't check that code. Try again in a moment.");
  }
}

async function load(){
  if (!/^[A-Za-z0-9_-]{8,32}$/.test(slug)){
    app.replaceChildren(el("p","center small","That ledger link doesn't look right."));
    return;
  }
  try {
    const data = await rpc("get_ledger", {p_slug: slug});
    if (!data) {
      app.replaceChildren(el("p","center small","This ledger no longer exists."));
      return;
    }
    render(data);
  } catch(e){
    app.replaceChildren(el("p","center small","Couldn't load this ledger. Try again in a moment."));
  }
}

if (slug) load();
else if (params.get("c")) join(params.get("c"));
else codeEntry();
// A live game moves; refresh while the tab is open so players see buy-ins as they happen.
// Never mid-typing: a refresh rebuilds the page and would wipe an amount half entered.
const typing = () => [...document.querySelectorAll("input")].some(i => i.value || i === document.activeElement);
setInterval(() => { if (slug && !document.hidden && !typing()) load(); }, 20000);
</script>
</body>
</html>
